apiVersion: apps/v1
kind: Deployment
metadata:
  name: cricket-ai-deployment
  labels:
    app: cricket-ai
    version: v2.1.3
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cricket-ai
  template:
    metadata:
      labels:
        app: cricket-ai        cd blockchain
        npx hardhat compile  # Compile the smart contracts
        version: v2.1.3
    spec:
      containers:
      - name: cricket-ai
        image: cricketai/no-ball-detection:latest
        ports:
        - containerPort: 80
        env:
        - name: NODE_ENV
          value: "production"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
      imagePullSecrets:
      - name: docker-registry-secret
---
apiVersion: v1
kind: Service
metadata:
  name: cricket-ai-service
  labels:
    app: cricket-ai
spec:
  selector:
    app: cricket-ai
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
  type: LoadBalancer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cricket-ai-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - cricket-ai.example.com
    secretName: cricket-ai-tls
  rules:
  - host: cricket-ai.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cricket-ai-service
            port:
              number: 80